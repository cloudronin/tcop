<svg xmlns="http://www.w3.org/2000/svg" width="930" height="160"><text x="10" y="28" font-size="16">TCX receiver acceptance state machine</text><text x="10" y="48" font-size="11">Any failed transition emits a rejection audit record and no gateway restriction.</text><rect x="10" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="14" y="91" font-size="9">received</text><rect x="93" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="97" y="91" font-size="9">parsed</text><rect x="176" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="180" y="91" font-size="9">signature checked</text><rect x="259" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="263" y="91" font-size="9">issuer authorized</text><rect x="342" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="346" y="91" font-size="9">freshness checked</text><rect x="425" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="429" y="91" font-size="9">replay checked</text><rect x="508" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="512" y="91" font-size="9">receipt resolved</text><rect x="591" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="595" y="91" font-size="9">binding matched</text><rect x="674" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="678" y="91" font-size="9">local policy</text><rect x="757" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="761" y="91" font-size="9">local decision</text><rect x="840" y="70" width="75" height="35" fill="#e8eef6" stroke="#235"/><text x="844" y="91" font-size="9">gateway disposition</text><path d="M 85 88 L 92 88" stroke="#235"/><path d="M 168 88 L 175 88" stroke="#235"/><path d="M 251 88 L 258 88" stroke="#235"/><path d="M 334 88 L 341 88" stroke="#235"/><path d="M 417 88 L 424 88" stroke="#235"/><path d="M 500 88 L 507 88" stroke="#235"/><path d="M 583 88 L 590 88" stroke="#235"/><path d=