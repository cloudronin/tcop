    source: calibrated_simulator
    calibration_status: calibrated
    simulator_sha256: required_embedded
    calibration_sha256: required_embedded
    seed: required_embedded
    finalized_grid: required_embedded
    grid_finalization_sha256: required_embedded
    post_hoc: forbidden_on_sealed_or_result_paths
  tlc_pass_record: required_before_any_live_run
  binding_table:
    deny_egress:
      native_implementation: UpdateConfig
      native_grade: meets
      harness_implementation: vm_forwarding_filter
      harness_grade: meets
      native_layering: pure layering
      harness_layering: extension
    revoke_credential:
      native_implementation: DetachSandboxProvider
      native_grade: meets more coarsely
      coarsening: whole provider, including every credential it holds
      harness_implementation: null
      native_layering: pure layering
    freeze_sandbox:
      native_implementation: null
      native_grade: does not meet
      harness_implementation: docker_pause
      harness_grade: meets
      harness_layering: extension
    snapshot_sandbox:
      native_implementation: null
      native_grade: does not meet
      harness_implementation: docker_commit_no_pause
      harness_grade: meets more coarsely
      harness_layering: extension
      capability_only: true
      coarsening: filesystem coverage and capture-interval observation; no memory or mounted data
    approval_delay:
      kind: submission_condition
      native_implementation: null
      native_grade: does not meet the condition
      harness_implementation: fixed_delay_always_approve
      harness_grade: meets the condition
      tag: harness
      layering: pure layering
