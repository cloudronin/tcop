      E2-native-b: native-egress-10
      E2-native-min-a: native-egress-1
      E2-extended-a: instant-egress
      E2-extended-b: instant-egress
    S-C:
      E2-native-a: provider-detach-10
      E2-native-b: provider-detach-10
      E2-native-min-a: provider-detach-1
      E2-extended-a: freeze
      E2-extended-b: freeze
  bindings:
    native-egress-10:
      abstract_action: deny_egress
      implementation: UpdateConfig
      tag: native
      grade: meets
      layering: pure layering
      conformance_check: C1
      poll_interval_secs: 10
    native-egress-1:
      abstract_action: deny_egress
      implementation: UpdateConfig
      tag: native
      grade: meets
      layering: pure layering
      conformance_check: C1
      poll_interval_secs: 1
    instant-egress:
      abstract_action: deny_egress
      implementation: vm_forwarding_filter
      tag: harness
      grade: meets
      layering: extension
      conformance_check: C1
      poll_interval_secs: 10
    provider-detach-10:
      abstract_action: revoke_credential
      implementation: DetachSandboxProvider
      tag: native
      grade: meets more coarsely
      layering: pure layering
      conformance_check: C2
      poll_interval_secs: 10
    provider-detach-1:
      abstract_action: revoke_credential
      implementation: DetachSandboxProvider
      tag: native
      grade: meets more coarsely
      layering: pure layering
      conformance_check: C2
      poll_interval_secs: 1
    freeze:
      abstract_action: freeze_sandbox
      implementation: docker_pause
      tag: harness
      grade: meets
      layering: extension
      conformance_check: C3
      poll_interval_secs: 10
    snapshot:
      abstract_action: snapshot_sandbox
      implementation: docker_commit_no_pause
      tag: harness
      grade: meets more coarsely
      layering: extension
      conformance_check: C4
      poll_interval_secs: 10
  abstract_actions:
    deny_egress: New connections to that destination fail.
    revoke_credential: The credential stops resolving for new requests; requests already in flight may finish.
    freeze_sandbox: Nothing further runs in the sandbox until it is released outside the adapter.
    snapshot_sandbox: Sandbox state is captured; it restricts nothing. Capability only; never on the frontier.
  provisional_action_interval_ms:
  - 25
  - 400
  - 5000
  - 20000
  grid_finalization_rule:
  - one_below_fastest_harness_effect_lag
  - one_between_harness_lags_and_native_1s_poll_effect_lag
  - one_inside_10s_default_poll_window
  - one_beyond_10s_default_poll_window
