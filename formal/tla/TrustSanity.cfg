SPECIFICATION TrustSpec
CONSTANTS
  Destinations = {d0, d1}
  Credentials = {c0, c1}
  PrimaryDest = d0
  PrimaryCredential = c0
  MinLag <- MCTrustMin
  MaxLag <- MCTrustMax
  ActionInterval = 1
  ApprovalDelay = 0
  BaselineDeniesA0 = FALSE
  A0Kind = "egress"
  LocalChoices <- MCTrustChoices
  ReadyAtEmission = FALSE
  MaxMessages = 1
  ReceiveUntil = 0
  Messages <- MCTrustSingleMessage
  Peers = {p0}
  Sessions = {s0}
  BoundSession = s0
  PeerA = p0
  PeerB = p0
  OtherSession = s0
  AlternateDest = d1
  TrafficRoutes <- MCTrustSingleRoute
  WarningData <- MCWarnings
  AuxUntil = 1
INVARIANT TrustTypeOK
INVARIANT TrustRaisedLocally
INVARIANT ReceiptProvenance
INVARIANT ReceiptBoundRestrictions
INVARIANT QuarantinedIssuerNoEffect
INVARIANT ZeroTrustOwnDestinationsOnly
INVARIANT AcceptOnlyValid
INVARIANT LadderOrder
INVARIANT A4Independent
INVARIANT BoundedCompletion
PROPERTY NoWidening
PROPERTY EffectHolds
PROPERTY LyingPeerOnlyCostsAvailability
INVARIANT TrustWitnessReport
