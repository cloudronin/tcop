[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcop-framework"
version = "0.6.0"
description = "Deterministic TCOP framework and unified protocol, service, study, and artifact CLI"
requires-python = ">=3.11"
dependencies = ["cryptography>=41", "PyYAML>=6"]

[project.scripts]
tcop = "tcop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tcop = ["data/*.json"]
