[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tcop-framework"
version = "0.2.0"
description = "Deterministic TCOP reference framework with frozen v0.1 and witness v0.2 profiles"
requires-python = ">=3.11"
dependencies = ["cryptography>=41"]

[project.scripts]
tcop = "tcop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
